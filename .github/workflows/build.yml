name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        # Retries only when the failure looks like a dependency download problem (for example
        # Maven Central answering "429 Too Many Requests"); a real compile error fails right away.
        run: |
          for attempt in 1 2 3; do
            set +e
            gradle :app:assembleDebug 2>&1 | tee build.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if ! grep -qE "status code 429|Could not GET|Could not resolve|Read timed out|Connection reset" build.log; then
              echo "Not a download problem - not retrying."
              exit "$status"
            fi
            echo "Dependency download failed (attempt $attempt of 3); waiting before retrying..."
            sleep $((attempt * 45))
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: testmond-debug
          path: app/build/outputs/apk/debug/app-debug.apk
