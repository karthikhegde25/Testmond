name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        # Retries only when the failure looks like a dependency download problem (for example
        # Maven Central answering "429 Too Many Requests"); a real compile error fails right away.
        run: |
          for attempt in 1 2 3; do
            set +e
            gradle :app:assembleDebug 2>&1 | tee build.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if ! grep -qE "status code 429|Could not GET|Could not resolve|Read timed out|Connection reset" build.log; then
              echo "Not a download problem - not retrying."
              exit "$status"
            fi
            echo "Dependency download failed (attempt $attempt of 3); waiting before retrying..."
            sleep $((attempt * 45))
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: testmond-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Smaller, signed release APK (R8 + resource shrinking). Signing needs these repository
      # secrets: KEYSTORE_BASE64 (base64 of the .jks), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      # If KEYSTORE_BASE64 is not set the step still builds, but the APK is unsigned.
      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          TESTMOND_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TESTMOND_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TESTMOND_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export TESTMOND_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          fi
          gradle :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: testmond-release
          path: app/build/outputs/apk/release/*.apk
